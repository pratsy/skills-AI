skill:
  id: "example-skill"
  name: "Example Skill"
  domain: "sales"
  version: "1.0"

  objective: "Describe the business outcome this skill is meant to improve."

  business_problem: "Explain the real GTM problem this skill addresses."

  persona:
    - "Sales leader"
    - "Marketing manager"
    - "RevOps operator"

  decision_context:
    signals:
      - "account fit"
      - "pipeline quality"
      - "stakeholder depth"
      - "market or competitor movement"
    input_types:
      - "CRM data"
      - "sales notes"
      - "campaign and funnel metrics"
      - "customer feedback"

  failure_modes:
    - "Overweighting activity instead of buying readiness"
    - "Ignoring stakeholder complexity"
    - "Mistaking weak messaging for weak demand"
    - "Treating every market signal as equally important"

  domain_rules:
    - "Prioritize evidence over generic narrative"
    - "Treat output as decision support, not final fact"
    - "Account for user role and business context"
    - "Highlight uncertainty and needed validation"

  output_requirements:
    summary: "One clear statement of the core business issue"
    findings:
      - "Evidence-backed interpretation"
      - "Likely root cause"
      - "Risk flags"
    recommendations:
      - "Highest-priority action"
      - "Secondary actions"
      - "Ownership or follow-up owner"

  source_basis:
    - name: "MEDDIC-style qualification logic"
      type: "sales qualification framework"
      source: "public practitioner guidance"
    - name: "ICP and segmentation practice"
      type: "marketing and GTM framework"
      source: "public B2B marketing guidance"
    - name: "Pipeline quality review methods"
      type: "RevOps operational framework"
      source: "public revenue operations practice"

  operator_memory:
    historical_patterns:
      - "Typical issue seen in this motion"
      - "Common false positive or false negative"
      - "Known exception that should be checked"
    examples_of_good_outcome:
      - "Specific example of strong quality output"
    examples_of_bad_outcome:
      - "Specific example of wrong or weak reasoning"

  feedback_loop:
    human_review_questions:
      - "Did this output match the actual business reality?"
      - "Which part of the reasoning was wrong?"
      - "What information should be added next time?"
    memory_updates:
      - "Add new patterns from real-world usage"
      - "Refine failure modes"
      - "Add evidence and operator notes"

  references:
    - "Public framework or practitioner source"
    - "Case pattern from real operational experience"
    - "Internal learning notes that improve signal quality"
